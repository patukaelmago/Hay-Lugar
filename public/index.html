<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6eb">
  <meta name="description" content="Ingresá a Hay Lugar con tu cuenta de Google.">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-square.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Ingresar · Hay Lugar</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #281f18; background: #faf6eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: 1fr auto; }
    main { display: grid; place-items: center; padding: 32px 20px 64px; }
    .card { width: min(100%, 430px); background: #faf6eb; border: 1px solid #e8dece; border-radius: 24px; padding: clamp(28px, 6vw, 44px); text-align: center; box-shadow: 0 14px 55px #281f1808; }
    .logo { display: block; width: 100%; height: auto; margin: 0 auto 28px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .intro { color: #796b60; font-size: 15px; line-height: 1.6; margin: 0 0 32px; }
    button { width: 100%; min-height: 52px; border: 1px solid #dfd3c3; border-radius: 12px; background: #fff; color: #281f18; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; transition: background .15s, border-color .15s; }
    button:hover { background: #fff0ef; border-color: #f2737a; }
    button:focus-visible { outline: 3px solid #f2737a; outline-offset: 4px; }
    button:disabled { cursor: wait; opacity: .65; }
    button svg { width: 20px; height: 20px; flex-shrink: 0; }
    #status { font-size: 14px; line-height: 1.5; color: #796b60; margin: 18px 0 0; overflow-wrap: anywhere; }
    #status.error { color: #9d3428; }
    [hidden] { display: none !important; }
    .session-email { color: #281f18; font-weight: 600; }
    #logout { margin-top: 24px; }
    .panel-link { display: block; margin-top: 20px; padding: 14px; border-radius: 12px; background: #281f18; color: white; font-weight: 600; text-decoration: none; }
    footer { padding: 24px; text-align: center; font-size: 12px; color: #87776a; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="heading">
      <img class="logo" src="/logo.jpg" alt="Hay Lugar · Reservas online" width="1536" height="1024" fetchpriority="high">
      <h1 id="heading" class="sr-only">Ingresar</h1>
      <p class="intro" id="intro" hidden></p>
      <button id="login" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.97-3.38.97-2.6 0-4.82-1.76-5.61-4.12H3.04v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.93a6 6 0 0 1 0-3.86v-2.6H3.04a10 10 0 0 0 0 9.06l3.35-2.6Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.5l2.86-2.86A9.56 9.56 0 0 0 12 2a10 10 0 0 0-8.96 5.47l3.35 2.6A5.98 5.98 0 0 1 12 5.95Z"/></svg>
        <span id="login-label">Ingresar con Google</span>
      </button>
      <div id="session" hidden><p class="session-email" id="email"></p><a class="panel-link" href="/admin/pulpo">Administrar Pulpo</a><a class="panel-link" href="/guestcenter/pulpo">Dashboard · Pulpo</a><button id="logout" type="button">Cerrar sesión</button></div>
      <p id="status" role="status" aria-live="polite">Preparando el acceso…</p>
      <noscript><p>Activá JavaScript para ingresar con Google.</p></noscript>
    </section>
  </main>
  <footer>Hay Lugar · Sistema de reservas</footer>
  <script type="module">
    const login = document.querySelector('#login');
    const label = document.querySelector('#login-label');
    const logout = document.querySelector('#logout');
    const status = document.querySelector('#status');
    const message = (text, error = false) => { status.textContent = text; status.classList.toggle('error', error); };
    const errors = {
      'auth/popup-blocked': 'Tu navegador bloqueó la ventana de Google. Permití las ventanas emergentes y volvé a intentar.',
      'auth/network-request-failed': 'No pudimos conectarnos. Revisá tu conexión y volvé a intentar.',
      'auth/unauthorized-domain': 'El acceso todavía no está habilitado para esta dirección.',
      'auth/operation-not-allowed': 'El acceso con Google todavía no está disponible.'
    };
    try {
      const [{ initializeApp }, { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')
      ]);
      const app = initializeApp({
        apiKey: 'AIzaSyDt0Mr-l4533VuMHSQcCLY3HaBNyrDiDCY',
        authDomain: 'hay-lugar-1346d.firebaseapp.com',
        projectId: 'hay-lugar-1346d',
        storageBucket: 'hay-lugar-1346d.firebasestorage.app',
        messagingSenderId: '917217925247',
        appId: '1:917217925247:web:e0a2ff569a19b6239f074a'
      });
      const auth = getAuth(app);
      auth.languageCode = 'es';
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      onAuthStateChanged(auth, user => {
        login.hidden = Boolean(user);
        document.querySelector('#session').hidden = !user;
        document.querySelector('#email').textContent = user?.email || '';
        document.querySelector('#heading').textContent = user ? 'Ya ingresaste' : 'Ingresar';
        document.querySelector('#intro').textContent = user ? 'Tu sesión está iniciada.' : '';
        document.querySelector('#intro').hidden = !user;
        message('');
        login.disabled = false;
      }, () => message('No pudimos verificar la sesión. Recargá la página.', true));
      login.addEventListener('click', async () => {
        login.disabled = true;
        label.textContent = 'Conectando…';
        message('');
        try { await signInWithPopup(auth, provider); }
        catch (error) {
          if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
            message(errors[error.code] || 'No pudimos iniciar sesión. Volvé a intentar.', true);
          }
        } finally { login.disabled = false; label.textContent = 'Ingresar con Google'; }
      });
      logout.addEventListener('click', async () => {
        logout.disabled = true;
        try { await signOut(auth); }
        catch { message('No pudimos cerrar la sesión. Volvé a intentar.', true); }
        finally { logout.disabled = false; }
      });
    } catch { message('No pudimos cargar el acceso. Revisá tu conexión y recargá la página.', true); }
  </script>
</body>
</html>
