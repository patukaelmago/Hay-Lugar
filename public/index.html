<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="Ingresá a Hay Lugar con tu cuenta de Google.">
  <title>Ingresar · Hay Lugar</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203a32; background: #f5f4ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 28px clamp(24px, 6vw, 80px); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 750; letter-spacing: -.7px; }
    .brand svg { width: 34px; height: 34px; }
    main { display: grid; place-items: center; padding: 32px 20px 64px; }
    .card { width: min(100%, 430px); background: #fff; border: 1px solid #e3e7df; border-radius: 24px; padding: clamp(28px, 6vw, 44px); text-align: center; box-shadow: 0 14px 55px #203a3208; }
    .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 28px; border-radius: 20px; background: #eaf1e7; }
    .mark svg { width: 32px; height: 32px; }
    h1 { font-size: clamp(28px, 6vw, 34px); line-height: 1.2; letter-spacing: -1.2px; margin: 0 0 12px; }
    .intro { color: #66766d; font-size: 15px; line-height: 1.6; margin: 0 0 32px; }
    button { width: 100%; min-height: 52px; border: 1px solid #dbe1da; border-radius: 12px; background: #fff; color: #203a32; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; transition: background .15s, border-color .15s; }
    button:hover { background: #f7faf5; border-color: #a2b49e; }
    button:focus-visible { outline: 3px solid #82aa75; outline-offset: 4px; }
    button:disabled { cursor: wait; opacity: .65; }
    button svg { width: 20px; height: 20px; flex-shrink: 0; }
    #status { font-size: 14px; line-height: 1.5; color: #66766d; margin: 18px 0 0; overflow-wrap: anywhere; }
    #status.error { color: #9d3428; }
    [hidden] { display: none !important; }
    .session-email { color: #203a32; font-weight: 600; }
    #logout { margin-top: 24px; }
    footer { padding: 24px; text-align: center; font-size: 12px; color: #7b887e; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <header><div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#203a32"/><path d="M12 11v18m16-18v18M12 20h16" stroke="#eaf1e7" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="11" r="3" fill="#b5d98f"/></svg>Hay Lugar</div></header>
  <main>
    <section class="card" aria-labelledby="heading">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="6" y="5" width="20" height="22" rx="4" stroke="#42633b" stroke-width="2"/><path d="M11 3v5m10-5v5M6 12h20m-14 8 3 3 6-6" stroke="#42633b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 id="heading">Bienvenido a Hay Lugar</h1>
      <p class="intro" id="intro">Ingresá con tu cuenta de Google.</p>
      <button id="login" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.97-3.38.97-2.6 0-4.82-1.76-5.61-4.12H3.04v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.93a6 6 0 0 1 0-3.86v-2.6H3.04a10 10 0 0 0 0 9.06l3.35-2.6Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.5l2.86-2.86A9.56 9.56 0 0 0 12 2a10 10 0 0 0-8.96 5.47l3.35 2.6A5.98 5.98 0 0 1 12 5.95Z"/></svg>
        <span id="login-label">Ingresar con Google</span>
      </button>
      <div id="session" hidden><p class="session-email" id="email"></p><button id="logout" type="button">Cerrar sesión</button></div>
      <p id="status" role="status" aria-live="polite">Preparando el acceso…</p>
      <noscript><p>Activá JavaScript para ingresar con Google.</p></noscript>
    </section>
  </main>
  <footer>Hay Lugar · Sistema de reservas</footer>
  <script type="module">
    const login = document.querySelector('#login');
    const label = document.querySelector('#login-label');
    const logout = document.querySelector('#logout');
    const status = document.querySelector('#status');
    const message = (text, error = false) => { status.textContent = text; status.classList.toggle('error', error); };
    const errors = {
      'auth/popup-blocked': 'Tu navegador bloqueó la ventana de Google. Permití las ventanas emergentes y volvé a intentar.',
      'auth/network-request-failed': 'No pudimos conectarnos. Revisá tu conexión y volvé a intentar.',
      'auth/unauthorized-domain': 'El acceso todavía no está habilitado para esta dirección.',
      'auth/operation-not-allowed': 'El acceso con Google todavía no está disponible.'
    };
    try {
      const [{ initializeApp }, { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')
      ]);
      const app = initializeApp({
        apiKey: 'AIzaSyDt0Mr-l4533VuMHSQcCLY3HaBNyrDiDCY',
        authDomain: 'hay-lugar-1346d.firebaseapp.com',
        projectId: 'hay-lugar-1346d',
        storageBucket: 'hay-lugar-1346d.firebasestorage.app',
        messagingSenderId: '917217925247',
        appId: '1:917217925247:web:e0a2ff569a19b6239f074a'
      });
      const auth = getAuth(app);
      auth.languageCode = 'es';
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      onAuthStateChanged(auth, user => {
        login.hidden = Boolean(user);
        document.querySelector('#session').hidden = !user;
        document.querySelector('#email').textContent = user?.email || '';
        document.querySelector('#heading').textContent = user ? 'Ya ingresaste' : 'Bienvenido a Hay Lugar';
        document.querySelector('#intro').textContent = user ? 'Tu sesión está iniciada.' : 'Ingresá con tu cuenta de Google.';
        message(user ? 'El panel estará disponible próximamente.' : '');
        login.disabled = false;
      }, () => message('No pudimos verificar la sesión. Recargá la página.', true));
      login.addEventListener('click', async () => {
        login.disabled = true;
        label.textContent = 'Conectando…';
        message('');
        try { await signInWithPopup(auth, provider); }
        catch (error) {
          if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
            message(errors[error.code] || 'No pudimos iniciar sesión. Volvé a intentar.', true);
          }
        } finally { login.disabled = false; label.textContent = 'Ingresar con Google'; }
      });
      logout.addEventListener('click', async () => {
        logout.disabled = true;
        try { await signOut(auth); }
        catch { message('No pudimos cerrar la sesión. Volvé a intentar.', true); }
        finally { logout.disabled = false; }
      });
    } catch { message('No pudimos cargar el acceso. Revisá tu conexión y recargá la página.', true); }
  </script>
</body>
</html>
